[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textreflow"
version = "1.0.0"
description = "Layout regions to ordered, typed prose: column-aware reading order and paragraph reconstruction for any document layout detector."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mudit Choudhary" }]
keywords = ["pdf", "document-parsing", "layout-analysis", "reading-order", "rag", "docling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: General",
]
dependencies = []                       # standard library only, on purpose

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mudit-choudhary/textreflow"
DOI = "https://doi.org/10.5281/zenodo.22872013"
Evaluation = "https://github.com/mudit-choudhary/Anneal/blob/main/evals/Reports/parser_quality_60.json"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
